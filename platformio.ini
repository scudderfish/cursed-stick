; PlatformIO project — Gotek WiFi "USB stick" (ESP32-S3, Arduino framework)
;
; Requires an ESP32-S3 with native USB (OTG) + PSRAM, e.g. ESP32-S3-DevKitC-1
; with an N16R8 module (16 MB flash + 8 MB octal PSRAM).
;
; The ONLY chip variants that work here are ESP32-S2 / S3 / C6 / P4 — a classic
; ESP32 or an ESP32-C3 has no usable USB-OTG peripheral.
;
; The MSC device is built from the arduino-esp32 core's own TinyUSB classes
; (USBMSC + USB.begin()); the Adafruit TinyUSB library is NOT used — it ships a
; second copy of TinyUSB that duplicate-symbols the core's libarduino_tinyusb.
;
; NOTE: ARDUINO_USB_MODE selects the native USB mode: 0 = USB-OTG (TinyUSB),
; 1 = Hardware CDC and JTAG. It must stay 0 here (see build_flags below).

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; 16 MB flash layout: 6 MB app + ~9.9 MB LittleFS (see partitions.csv)
board_build.partitions = partitions.csv
; Enables `pio run -t uploadfs` for offline seeding from data/ (no WiFi needed).
; The firmware still builds the FAT16 image from LittleFS at runtime.
board_build.filesystem = littlefs
; QIO flash + OPI PSRAM = N16R8 module. Adjust if your module differs.
board_build.arduino.memory_type = qio_opi
; The board JSON describes the N8 variant and declares upload.flash_size = 8MB.
; This module is an N16R8 (16 MB) and partitions.csv runs to 0x1000000, so declare
; the real size. This only stamps the app image header (byte 3 = size<<4 | speed)
; and the esptool argument — it does NOT gate partition access: the prebuilt
; bootloader is built with CONFIG_ESPTOOLPY_FLASHSIZE_DETECT=1 and auto-detects the
; chip, so the whole 16 MB (including the FS partition above 0x800000) is reachable.
board_upload.flash_size = 16MB

build_flags =
    -D ARDUINO_USB_MODE=0          ; 0 = USB-OTG (TinyUSB); 1 = Hardware CDC and JTAG
    -D ARDUINO_USB_CDC_ON_BOOT=0   ; Serial on UART0; native port is MSC-only
